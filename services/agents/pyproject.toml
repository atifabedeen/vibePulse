[project]
name = "vibebite-agents"
version = "0.1.0"
description = "VibeBite LangGraph agent workflows (skeleton + stubs at C1-C)"
requires-python = ">=3.9,<3.13"
dependencies = [
  "pydantic>=2.6",
  "httpx>=0.27",
  "structlog>=24.1",
  "eval-type-backport>=0.2",  # lets Pydantic v2 evaluate `X | None` on Python 3.9
  "langgraph>=0.2.50",
  "rich>=13.0",
  "google-genai>=1.0",
  "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["vibebite_agents*"]

# Inherit shared lint/format/type-check config from the root.
# (Ruff's `extend` is a path to another pyproject-style file.)
[tool.ruff]
extend = "../../pyproject.toml"

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.mypy]
python_version = "3.9"
strict = true
