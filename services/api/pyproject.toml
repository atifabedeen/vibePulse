[project]
name = "vibebite-api"
version = "0.1.0"
description = "VibeBite FastAPI public API service"
requires-python = ">=3.9,<3.13"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "psycopg[binary,pool]>=3.1",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "structlog>=24.1",
  "redis>=5.0",
  "python-jose[cryptography]>=3.3",
  "passlib[argon2]>=1.7.4",
  "pgvector>=0.2.5",
  "eval-type-backport>=0.2",  # lets Pydantic v2 evaluate `X | None` on Python 3.9
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# Inherit shared lint/format/type-check config from the root.
# (Ruff's `extend` is a path to another pyproject-style file.)
[tool.ruff]
extend = "../../pyproject.toml"

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.mypy]
python_version = "3.9"
strict = true
# Vendor types missing for these — keep strict elsewhere.
[[tool.mypy.overrides]]
module = ["jose.*", "passlib.*", "pgvector.*"]
ignore_missing_imports = true
