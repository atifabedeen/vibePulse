services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vibebite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vibebite
      POSTGRES_USER: vibebite
      POSTGRES_PASSWORD: vibebite
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibebite -d vibebite"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vibebite-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
